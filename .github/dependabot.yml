---
version: 2

updates:
  # Root workspace npm dependencies
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 10
    assignees:
      - antik1108
    labels:
      - dependencies
      - root
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    pull-request-branch-name:
      separator: "/"
    allow:
      - dependency-type: all
    versioning-strategy: auto

  # API app npm dependencies (NestJS)
  - package-ecosystem: npm
    directory: "/apps/api"
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
    open-pull-requests-limit: 10
    assignees:
      - antik1108
    labels:
      - dependencies
      - api
      - backend
    commit-message:
      prefix: "chore(api/deps)"
      prefix-development: "chore(api/deps-dev)"
      include: scope
    pull-request-branch-name:
      separator: "/"
    allow:
      - dependency-type: all
    versioning-strategy: auto

  # Web app npm dependencies (Next.js)
  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
    open-pull-requests-limit: 10
    assignees:
      - antik1108
    labels:
      - dependencies
      - web
      - frontend
    commit-message:
      prefix: "chore(web/deps)"
      prefix-development: "chore(web/deps-dev)"
      include: scope
    pull-request-branch-name:
      separator: "/"
    allow:
      - dependency-type: all
    versioning-strategy: auto

  # Prisma schema and migrations
  - package-ecosystem: npm
    directory: "/prisma"
    schedule:
      interval: weekly
      day: monday
      time: "03:45"
    open-pull-requests-limit: 5
    assignees:
      - antik1108
    labels:
      - dependencies
      - database
      - prisma
    commit-message:
      prefix: "chore(prisma/deps)"
      include: scope
    pull-request-branch-name:
      separator: "/"
    allow:
      - dependency-type: all
    versioning-strategy: auto

  # Shared config packages
  - package-ecosystem: npm
    directory: "/packages/config"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 5
    assignees:
      - antik1108
    labels:
      - dependencies
      - packages
      - config
    commit-message:
      prefix: "chore(config/deps)"
      include: scope
    pull-request-branch-name:
      separator: "/"
    allow:
      - dependency-type: all
    versioning-strategy: auto

  # Shared types packages
  - package-ecosystem: npm
    directory: "/packages/shared-types"
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
    open-pull-requests-limit: 5
    assignees:
      - antik1108
    labels:
      - dependencies
      - packages
      - types
    commit-message:
      prefix: "chore(shared-types/deps)"
      include: scope
    pull-request-branch-name:
      separator: "/"
    allow:
      - dependency-type: all
    versioning-strategy: auto

  # Shared utilities packages
  - package-ecosystem: npm
    directory: "/packages/utils"
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
    open-pull-requests-limit: 5
    assignees:
      - antik1108
    labels:
      - dependencies
      - packages
      - utils
    commit-message:
      prefix: "chore(utils/deps)"
      include: scope
    pull-request-branch-name:
      separator: "/"
    allow:
      - dependency-type: all
    versioning-strategy: auto

  # Docker image updates - API
  - package-ecosystem: docker
    directory: "/apps/api"
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
    open-pull-requests-limit: 5
    assignees:
      - antik1108
    labels:
      - dependencies
      - docker
      - api
    commit-message:
      prefix: "ci(docker/api)"
      include: scope