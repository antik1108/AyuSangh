services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ayusangh
    ports:
      - "5432:5432"
    volumes:
      - ayusangh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ayusangh"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ayusangh_pgdata:
