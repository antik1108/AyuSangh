services:
  # ─── Database ───────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ayusangh_admin
      POSTGRES_PASSWORD: ayusangh_password
      POSTGRES_DB: ayusangh_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayusangh_admin -d ayusangh_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── pgAdmin (DB GUI) ────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ayusangh.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # ─── Backend API (NestJS) ────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://ayusangh_admin:ayusangh_password@postgres:5432/ayusangh_db
      JWT_SECRET: ayusangh_super_secret_jwt_key
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Frontend (Next.js) ──────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      - api

volumes:
  postgres_data:
